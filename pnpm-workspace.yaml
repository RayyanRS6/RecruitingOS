packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
allowBuilds:
  '@sentry/cli': false
  esbuild: true
# Dependency audit (21 Sep, item 7): next pins a postcss with two high advisories; 8.5.x is a compatible patch line.
# 7 Oct: source-map-js (GHSA-68fv-2mgg-jv7q, under postcss) and sharp (GHSA-wq5f-xc86-pv6w, under next) gained high
# advisories; both are build-time or image-optimisation paths, moved to the patched lines.
# 21 Oct: vite (under vitest, tests only) gained a high advisory (GHSA-587h-7wmj-h5pm); moved to the patched 7.3 line.
overrides:
  "postcss@<8.5.23": ">=8.5.23"
  "source-map-js@<1.2.2": "^1.2.2"
  "sharp@<0.35.5": "^0.35.5"
  "vite@<7.3.7": "^7.3.7"
