# Fairness tests on the real AI (the owner's request, 13 October 2026), run against the models the app uses (Claude
# Haiku 5.5; Claude Sonnet 5.5 writes the job), with made-up resumes only. The "Which tests" choice runs:
# - the resume reading and its scoring: twin resumes that differ only in a name, a graduation year or a zip code must
#   read and score the same; the same resume read three times must read and score the same; quotes must be real; a
#   gap, a career change or no degree is never marked down alone; an earlier rejection at the company changes nothing
#   that is sent; and the scoring never sees a name, email, phone, street, zip code or link;
# - the AI interview's chat and its scorecard (the screen and chat suites);
# - the job builder: the job written from what an owner types (the intake suites). Claude Sonnet 5.5 writes each job,
#   so that choice costs more than the resume tests.
# Started by hand from the Actions tab ("Run workflow"). It never runs on a pull request, so the key is never offered
# to a fork's code. About ten cents a run for the resume tests; the chat tests make more calls and cost more. How to
# use it: docs/runbooks/fairness-tests.md.
name: fairness

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Which tests (the first is the resume reading and scoring set)"
        type: choice
        options: ["resume,triage", "screen,chat", "resume,triage,screen,chat", "intake"]
        default: "resume,triage"
      # The ids stay: the concurrency group and the env below use them. The model and effort set the standard tier
      # (packages/ai/src/routing.ts): screening, and also the job builder's conversation, so the runbook says to keep
      # both as they are for the job-builder choice.
      screening_model:
        description: "Model for screening and the job builder's conversation (the app uses claude-haiku-5-5)"
        type: choice
        options: [claude-haiku-5-5, claude-sonnet-5-5]
        default: claude-haiku-5-5
      screening_effort:
        description: "How hard it thinks for screening and the job builder's conversation (app setting = what the app uses)"
        type: choice
        options: [app setting, low, medium, high]
        default: app setting

permissions:
  contents: read

# One run at a time per branch and choice, so runs of different choices can be compared side by side.
concurrency:
  group: fairness-${{ github.ref }}-${{ inputs.tests }}-${{ inputs.screening_model }}-${{ inputs.screening_effort }}
  cancel-in-progress: false

jobs:
  fairness:
    name: fairness tests (real AI)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # reads "packageManager" from package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install from the lockfile only
        run: pnpm install --frozen-lockfile

      - name: Check that the Anthropic key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the repository secret ANTHROPIC_API_KEY first (Settings > Secrets and variables > Actions). See docs/runbooks/fairness-tests.md."
            exit 1
          fi

      - name: The chosen tests on the real models (made-up resumes and conversations only)
        id: evals
        env:
          AI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only the two allowed models are offered; the app refuses any other (packages/ai/src/routing.ts).
          AI_MODEL_STANDARD: ${{ inputs.screening_model || 'claude-haiku-5-5' }}
          AI_EFFORT_STANDARD: ${{ inputs.screening_effort != 'app setting' && inputs.screening_effort || '' }}
          # One of the fixed choices above, passed through the environment rather than pasted into the command. A name
          # in it that chooses no suite fails the run. tests/policy/fairness-choices.test.ts checks each choice against
          # packages/evals/thresholds.json, which CI's whole run of the evaluations holds to the runner's own suites.
          SUITES: ${{ inputs.tests || 'resume,triage' }}
        run: pnpm --filter @ros/evals exec tsx src/runner.ts --suite "$SUITES"

      - name: Summary in plain words
        if: ${{ !cancelled() && steps.evals.outcome != 'skipped' }}
        run: pnpm --silent --filter @ros/evals exec tsx src/summary.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Result file (synthetic data only)
        if: ${{ !cancelled() && steps.evals.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: fairness-results
          path: packages/evals/results
          retention-days: 90
          if-no-files-found: warn
