# Continuous integration for Recruiting OS (founder instruction of 21 September 2026, item 7).
# Everything runs against fakes: no live credential, account or candidate data is used or needed. Pull requests from
# forks get the same checks with no secrets at all. Artifacts hold the Playwright report only (synthetic data).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: "1"
  # Fake providers only. Nothing here is a secret; nothing here reaches a real service.
  AI_PROVIDER: fake
  EMAIL_PROVIDER: fake
  SMS_PROVIDER: fake
  AUTH_PROVIDER: fake
  CALENDAR_PROVIDER: fake
  ANALYTICS_PROVIDER: fake
  SECRET_STORE: memory
  STORAGE_PROVIDER: memory
  PGLITE_DIR: "memory://"
  WORKER_INLINE: "true"
  COMP_BLS_ENABLED: "false"
  MAGIC_LINK_ENABLED: "true"
  RATE_LIMIT_STORE: fake
  CSP_MODE: report-only

jobs:
  # `verify` is the required status check on main. Since 9 November 2026 it is the last job: it passes only when `checks`
  # (everything that used to run inside it) and every part of `flows` (the whole hire and the whole application, the
  # owner's "please test it thoroughly ... test both these flows" of 6 November 2026) passed. The three run side by side,
  # each inside its own time limit, so the gate covers the long flows without pushing any one job past its limit, and the
  # branch protection keeps the same check name.
  checks:
    name: checks # lockfile install, secret scans, audit, typecheck, migration validation, tests, evals, build, browser journeys with accessibility checks
    # Pinned (12 October 2026): ubuntu-latest moves to Ubuntu 26.04 from 19 October, where /tmp is held in memory
    # (actions/runner-images#14777) and the browsers keep their profiles and traces there. Revisit when #14777 is fixed
    # or GitHub announces an end date for 24.04: one green run on a branch with ubuntu-26.04, then switch.
    runs-on: ubuntu-24.04
    # The browser journeys run one at a time against `next dev`, in four runs with a server each (about 50 minutes),
    # after about 20 minutes of other checks. The whole flows are not among them: they are the `flows` job's.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history on pull requests

      # v5 is v4.3.0's code labelled for Node 24; v6 changes how pnpm itself is installed.
      - uses: pnpm/action-setup@v5 # reads "packageManager" from package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install from the lockfile only
        run: pnpm install --frozen-lockfile

      - name: Secret scanning (gitleaks, pinned release, no licence or secret needed)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .

      - name: Secret scanning (repository patterns)
        run: pnpm secret-scan

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migration validation (numbering, destructive statements, row-level security, tenant grants)
        run: pnpm db:validate

      - name: Service-role guard, row-level security, tenant isolation, unit and integration tests
        run: pnpm test

      - name: AI evals against the fake provider
        run: pnpm eval

      - name: Next.js production build
        run: pnpm --filter @ros/shell build

      - name: Playwright browsers
        run: pnpm --filter @ros/e2e exec playwright install --with-deps chromium

      # In four runs, each with a dev server of its own: one server for all 32 journeys grew until the runner was shut
      # down mid-run twice (10 October 2026), the route inventory, which compiles every page in one test, needs a fresh
      # server of its own to stay under the heap limit, and the sign-up mode is the server's, so the journey that asks for
      # approval has one too (the other runs skip it). Each run writes its own report; all are uploaded below. The later
      # three run even when the first half fails (so every failure is reported), but only once the browser journeys have
      # actually started: an earlier failing step (lint, tests, build) skips all four.
      - name: End-to-end journeys with accessibility checks (first half)
        id: e2e_first
        run: pnpm --filter @ros/e2e exec playwright test --project=chromium --project=phone --shard=1/2 --grep-invert "route inventory"
        env:
          E2E_REPORT_DIR: report/1

      - name: End-to-end journeys with accessibility checks (second half)
        if: ${{ !cancelled() && steps.e2e_first.outcome != 'skipped' }}
        run: pnpm --filter @ros/e2e exec playwright test --project=chromium --project=phone --shard=2/2 --grep-invert "route inventory"
        env:
          E2E_REPORT_DIR: report/2

      - name: Route inventory (every page, signed out, wrong role and right role)
        if: ${{ !cancelled() && steps.e2e_first.outcome != 'skipped' }}
        run: pnpm --filter @ros/e2e exec playwright test specs/routes.spec.ts
        env:
          E2E_REPORT_DIR: report/3

      - name: First sign-in asks for approval (a server in SIGNUP_MODE=approval)
        if: ${{ !cancelled() && steps.e2e_first.outcome != 'skipped' }}
        run: pnpm --filter @ros/e2e exec playwright test specs/access-approval.spec.ts
        env:
          E2E_REPORT_DIR: report/4
          SIGNUP_MODE: approval

      - name: Playwright report (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/report
          retention-days: 7
          if-no-files-found: warn

  # The whole flows (tests/e2e/specs/flow-*.spec.ts, the Playwright projects "flows" and "flows-phone"): each walks a whole
  # hire or a whole application through the real screens and reads every email by its words, so each takes minutes. They
  # run in parts, each with a dev server of its own, beside `checks`. The sign-up mode and the email provider are the
  # server's, so the specs that need SIGNUP_MODE=approval, or an email provider that never delivers, have a part each (and
  # skip themselves in the others).
  flows:
    name: flows (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: sign-up by approval
            args: specs/flow-whole-hire.spec.ts specs/flow-owner-signup-approval.spec.ts
            signup: approval
          - part: 1 of 3
            args: --shard=1/3
          - part: 2 of 3
            args: --shard=2/3
          - part: 3 of 3
            args: --shard=3/3
          - part: email down
            args: specs/flow-email-down.spec.ts
            email: postmark
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5 # reads "packageManager" from package.json

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install from the lockfile only
        run: pnpm install --frozen-lockfile

      - name: Playwright browsers
        run: pnpm --filter @ros/e2e exec playwright install --with-deps chromium

      - name: The whole flows (${{ matrix.part }})
        run: pnpm --filter @ros/e2e exec playwright test --project=flows --project=flows-phone ${{ matrix.args }}
        env:
          E2E_REPORT_DIR: report/flows-${{ strategy.job-index }}
          # empty in the parts that do not set them: open sign-up and the fake email adapter
          SIGNUP_MODE: ${{ matrix.signup }}
          E2E_EMAIL_PROVIDER: ${{ matrix.email }}

      - name: Playwright report (synthetic data only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-flows-${{ strategy.job-index }}
          path: tests/e2e/report
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: verify # the required status check on main: green only when `checks` and every part of `flows` passed
    needs: [checks, flows]
    # Runs when either failed, so the check reads failed rather than skipped (a skipped required check would let a merge
    # through); not when the run itself was cancelled by a newer push.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every check and every whole flow passed
        run: |
          echo "checks: ${{ needs.checks.result }}; flows: ${{ needs.flows.result }}"
          test "${{ needs.checks.result }}" = "success"
          test "${{ needs.flows.result }}" = "success"
